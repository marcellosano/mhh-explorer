<meta charset="utf-8">
<title>Compound Europe</title>
<style>
:root{--bg:#f3f3ef;--panel:#ffffff;--ink:#22272e;--muted:#6b6f76;--line:#d9d9d2;--soft:#eeeee9;--paper:#ffffff;--land:#e9e9e9;--heat:#ad1f2d;--flood:#2171b5;--wind:#5e3c99;--teal:#3b8ea5;--hist:#C6DBEF;--s126:#3182BD;--s370:#E6961E;--s585:#AD1F2D;--accent:#ad1f2d;--chip:#f7f7f4;--warn:#b7791f;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--panel:#24272c;--ink:#e8e8e3;--muted:#a3a7ae;--line:#3a3e46;--soft:#2c3036;--chip:#2c3036}}
:root[data-theme="dark"]{--bg:#1b1d21;--panel:#24272c;--ink:#e8e8e3;--muted:#a3a7ae;--line:#3a3e46;--soft:#2c3036;--chip:#2c3036}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance}
h1{font-size:20px}h2{font-size:17px}h3{font-size:14px}
button,select,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:12px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.mock{background:#fff4d6;color:#7a5a00;border-color:#e6c26a}
.btn{padding:4px 10px;border:1px solid var(--line);background:var(--chip);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shell{display:grid;grid-template-columns:150px 1fr;min-height:calc(100vh - 50px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.rail button{text-align:left;padding:6px 8px;border:0;background:transparent;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.rail button .n{color:var(--muted);width:12px;font-variant-numeric:tabular-nums}
.rail button.on{background:var(--soft);font-weight:600}
.rail button.concept .n::after{content:""}
.rail .lab{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px}
main{padding:10px 16px 24px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.grp .lab{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--chip);cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.hz.on[data-h="heat_drought_fire"]{background:var(--heat);border-color:var(--heat);color:#fff}
.chip.hz.on[data-h="flood"]{background:var(--flood);border-color:var(--flood);color:#fff}
.chip.hz.on[data-h="windstorm"]{background:var(--wind);border-color:var(--wind);color:#fff}
.chip.sc.on[data-s="hist"]{background:var(--hist);border-color:var(--hist);color:#22272e}
.chip.sc.on[data-s="ssp126"]{background:var(--s126);border-color:var(--s126);color:#fff}
.chip.sc.on[data-s="ssp370"]{background:var(--s370);border-color:var(--s370);color:#fff}
.chip.sc.on[data-s="ssp585"]{background:var(--s585);border-color:var(--s585);color:#fff}
select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--chip)}
.brief .adv{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.grid2.wide{grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr)}
@media (max-width:900px){.shell{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.rail .lab{display:none}.grid2,.grid2.wide{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.mapcard{background:var(--paper);color:#22272e;border:1px solid var(--line);border-radius:8px;padding:10px;position:relative}
.mapcard .title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-weight:700;font-size:15px}
.legend{margin-top:8px;color:#22272e}
.legend .bands{display:flex;align-items:stretch;height:16px;border:1px solid #bbb;margin:0 34px}
.legend .band{flex:1;position:relative}
.legend .band.off{background-image:repeating-linear-gradient(45deg,#fff 0 3px,#ccc 3px 4px)!important}
.legend .ends{display:flex;justify-content:space-between;font-size:11px;font-weight:700}
.legend .ends .fewer{color:#3b8ea5}.legend .ends .more{color:var(--accent)}
.legend .ticks{display:flex;margin:0 34px;font-size:11px;font-variant-numeric:tabular-nums;position:relative;height:14px}
.legend .ticks span{position:absolute;transform:translateX(-50%)}
.legend .toggles{display:flex;margin:2px 34px 0}
.legend .toggles label{flex:1;text-align:center;font-size:10px;color:#666}
.legend .hist{display:flex;align-items:flex-end;height:22px;margin:0 34px;gap:1px}
.legend .hist div{flex:1;background:#d7d7d2}
.legend .unit{font-size:11px;color:#555;margin-top:2px;text-align:center}
.readout{font-variant-numeric:tabular-nums;font-size:13px}
.readout table{border-collapse:collapse;width:100%}
.readout td,.readout th{padding:2px 6px;text-align:right;border-bottom:1px solid var(--line)}
.readout td:first-child,.readout th:first-child{text-align:left}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid #444}
.big{font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-family:Calibri,system-ui,sans-serif;color:var(--muted);display:block;margin-top:2px}
.caption{font-size:13px;line-height:1.45;margin-top:10px}
.caveat{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.state{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:var(--soft);font-size:12px}
.editor label{display:flex;flex-direction:column;gap:2px}
.editor input[type=text]{padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.editor .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=range]{width:100%}
.filters{display:flex;flex-direction:column;gap:10px;font-size:13px}
.filters .f{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center}
.filters .f .val{font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.months{display:flex;gap:3px;flex-wrap:wrap}
.months .chip{padding:1px 7px;font-size:12px}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tri button{border:0;background:var(--chip);padding:2px 8px;cursor:pointer;font-size:12px}
.tri button.on{background:var(--ink);color:var(--bg)}
.ledger{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin-top:6px}
.small{font-size:12px;color:var(--muted)}
.multi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.multi{grid-template-columns:1fr}}
.multi .mapcard{padding:6px}
.multi .mapcard .title{font-size:13px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line);padding:0 2px}
.bars div{flex:1;position:relative;min-width:2px}
.bars div b{position:absolute;bottom:0;left:0;right:0;border-radius:2px 2px 0 0}
.bars div i{position:absolute;bottom:0;left:15%;right:15%;border-radius:2px 2px 0 0;opacity:.85}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
table.data{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:20;transform:translateX(102%);transition:transform .2s}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer h2{display:flex;justify-content:space-between;align-items:center}
.drawer section{margin-top:12px}
.drawer .lab{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.story{display:grid;gap:8px;margin-top:8px}
.story button{text-align:left;padding:8px 10px;border:1px solid var(--line);background:var(--chip);border-radius:8px;cursor:pointer}
.story button b{display:block;font-family:inherit}
.concept{border:2px dashed #e6c26a;background:#fff9e8;color:#4d3b00;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
:root[data-theme="dark"] .concept,.concept{color:#4d3b00}
.def{font-size:13px;background:var(--soft);border-radius:6px;padding:8px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv b{font-weight:600}
.status{font-size:12px;color:var(--muted)}
.stipnote{font-size:11px;color:#555}
dl.defs{margin:0}dl.defs dt{font-weight:600;margin-top:6px}dl.defs dd{margin:0 0 0 0;color:var(--muted)}
.hzlab{font-weight:700}
.hzlab.heat_drought_fire{color:var(--heat)}.hzlab.flood{color:var(--flood)}.hzlab.windstorm{color:var(--wind)}
.notice{font-size:12px;color:var(--warn)}
.zoomhint{font-size:11px;color:#666;margin-top:3px}
.mapwrap{position:relative;outline:none}.mapwrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mapwrap canvas.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent;border:1px solid transparent}
.mapwrap canvas{cursor:grab}.mapwrap:active canvas{cursor:grabbing}
.panpad{position:absolute;top:8px;left:44px;display:grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(3,22px);gap:1px;z-index:2}
.panpad button{border:1px solid #999;background:rgba(255,255,255,.92);color:#22272e;border-radius:4px;font-size:10px;line-height:1;cursor:pointer;padding:0}
.panpad button:hover{border-color:#22272e}
.panpad [data-p=n]{grid-column:2;grid-row:1}.panpad [data-p=w]{grid-column:1;grid-row:2}.panpad [data-p=e]{grid-column:3;grid-row:2}.panpad [data-p=s]{grid-column:2;grid-row:3}
.zoomctl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:3px;z-index:2}
.zoomctl button{width:28px;height:28px;border:1px solid #999;background:rgba(255,255,255,.92);color:#22272e;border-radius:5px;font-size:17px;line-height:1;cursor:pointer;padding:0}
.zoomctl button:hover{border-color:#22272e}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0 12px}
.levels div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;background:var(--panel)}
.levels div b{display:block;font-size:14px}
.levels div.live{border-color:var(--ok)}
.levels div.build{border-style:dashed}
.qbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.qbar input[type=text]{flex:1;min-width:220px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chip);font-family:Menlo,Consolas,monospace;font-size:12px}
table.data th.sortable{cursor:pointer}table.data th.sorted{color:var(--ink)}
table.data tr.row{cursor:pointer}table.data tr.row:hover td{background:var(--soft)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.detail b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
</style>

function autoBreaks(vals,n=6){const v=Array.from(vals).filter(x=>x!=null&&Number.isFinite(x)).sort((a,b)=>a-b);if(!v.length)return [0,1];const q=p=>v[Math.min(v.length-1,Math.floor(p*(v.length-1)))];const raw=[q(0),q(.2),q(.4),q(.6),q(.8),q(.95),q(1)];const nice=x=>{if(x===0)return 0;const m=Math.pow(10,Math.floor(Math.log10(Math.abs(x)))-1);return Math.round(x/m)*m};let out=[...new Set(raw.map(nice))].sort((a,b)=>a-b);if(out.length<2)out=[out[0],out[0]+1];return out}

 const q=s=>V.querySelector(s);q("#dSet").onchange=e=>{S.data.set=e.target.value;S.data.q="";S.data.page=0;S.data.row=null;S.data.sort=S.data.set==="events"?"dur":"lat";render()};if(q("#dVar"))q("#dVar").onchange=e=>{S.svar=e.target.value;render()};
 q("#dGo").onclick=()=>{S.data.q=q("#dQ").value;S.data.page=0;render()};q("#dQ").onkeydown=e=>{if(e.key==="Enter"){S.data.q=q("#dQ").value;S.data.page=0;render()}};q("#dClear").onclick=()=>{S.data.q="";S.data.page=0;render()};
 q("#dPrev").onclick=()=>{S.data.page=Math.max(0,S.data.page-1);render()};q("#dNext").onclick=()=>{S.data.page=Math.min(pages-1,S.data.page+1);render()};if(q("#dCell"))q("#dCell").onclick=()=>{S.data.cell=null;render()};
 V.querySelectorAll("th.sortable").forEach(th=>th.onclick=()=>{const c=th.dataset.c;if(S.data.sort===c)S.data.desc=!S.data.desc;else{S.data.sort=c;S.data.desc=true}render()});
 V.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>{S.data.row=view[+tr.dataset.i];document.getElementById("dDetail").innerHTML=rowDetail(cols,S.data.row);document.getElementById("dDetail").scrollIntoView({block:"nearest"})});
 q("#dCsv").onclick=async()=>{const cap=20000;const txt=[cols.join(","),...rows.slice(0,cap).map(r=>r.map(x=>x==null?"":x).join(","))].join("\n");try{await navigator.clipboard.writeText(txt);q("#dMsg").textContent=`copied ${Math.min(rows.length,cap).toLocaleString()} rows${rows.length>cap?" (capped)":""}`}catch(e){q("#dMsg").textContent="clipboard blocked here; downloads work once hosted outside Claude"}}}
function rowDetail(cols,r){const o={};cols.forEach((c,i)=>o[c]=r[i]);const isEv=S.data.set==="events";return `<h3>Record</h3><div class="detail" style="margin-top:6px">${cols.map((c,i)=>`<span><b>${c}</b>${r[i]==null?"–":r[i]}</span>`).join("")}</div>
 ${isEv?`<div class="small" style="margin-top:8px"><b>Next level down.</b> This event was matched from a primary <code>${HZ[S.h].primary}</code> cluster and ${o.ncond} conditioning cluster${o.ncond==1?"":"s"} overlapping its disk within ${HZ[S.h].lag} days. The cluster rows (level 3) and the daily cells behind them (level 5) are not in this mockup. <button class="btn" id="dToMap">Show this event's window on the map</button></div>`:`<div class="small" style="margin-top:8px">Cell ${fmtLL(o)}. <button class="btn" id="dToPlace">Open place card</button></div>`}`}
document.addEventListener("click",e=>{if(e.target.id==="dToMap"){const r=S.data.row,cols=[];const w=r[1];S.scen=w==="hist"?"hist":w.split("_")[0];S.hor=w.endsWith("late")?"late":"mid";S.view=1;S.cmp="abs";resetScale();render()}if(e.target.id==="dToPlace"){const r=S.data.row;openPlace({lat:r[0],lon:r[1]})}});

/* ============ place card ============ */
async function openPlace(p){S.sel=p;const row=Math.round((p.lat-35.25)/0.5),col=Math.round((p.lon+14.75)/0.5);if(row<0||row>69||col<0||col>109){alert("Outside the domain (35–70°N, 15°W–40°E)");return}const gi=row*110+col,li=LAND.gridIdx[gi];const lat=35.25+row*0.5,lon=-14.75+col*0.5;const dr=document.getElementById("drawer");dr.classList.add("open");
 dr.innerHTML=`<h2><span>${lat.toFixed(2)}°N ${lon>=0?lon.toFixed(2)+"°E":(-lon).toFixed(2)+"°W"}</span><button class="btn" id="plClose">close</button></h2><div class="small">0.5° cell (~55 km). ${li<0?"Sea cell: compound occupancy is defined on land cells only.":""}</div><div id="plBody">loading…</div>`;
 dr.querySelector("#plClose").onclick=()=>dr.classList.remove("open");
 const sh=await loadSH();let html="";
 if(li>=0){const wk=wkey();const table=Object.keys(HZ).map(h=>{const cells=WINDOWS.map(w=>{const v=GCMS.map(g=>plane(h,g,w,"days")[li]);return v.reduce((a,b)=>a+b,0)/5});const per=GCMS.map(g=>plane(h,g,wk,"days")[li]);const hs=GCMS.map(g=>plane(h,g,"hist","days")[li]);const inc=per.filter((x,i)=>x>hs[i]).length;return `<tr><td class="hzlab ${h}">${HZ[h].label.replace("Compound ","")}</td>${cells.map(x=>`<td>${x.toFixed(0)}</td>`).join("")}<td><span class="dots">${per.map((x,i)=>`<i style="background:${x>hs[i]?HZ[h].col:x<hs[i]?"#3b8ea5":"#ccc"}" title="${GCMS[i]} ${x.toFixed(0)}"></i>`).join("")}</span> ${Math.min(...per).toFixed(0)}–${Math.max(...per).toFixed(0)}</td></tr>`}).join("");
  const hd=GCMS.map(g=>plane(S.h,g,"hist","days")[li]),fd=GCMS.map(g=>plane(S.h,g,wk,"days")[li]);const hm=hd.reduce((a,b)=>a+b)/5,fm=fd.reduce((a,b)=>a+b)/5;const inc=fd.filter((x,i)=>x>hd[i]).length;
  html+=`<section><div class="lab">Days a year inside a compound event (disk-rasterised, ensemble mean)</div><div class="tablewrap"><table class="data"><tr><th></th><th>1981–2010</th><th>1-2.6 mid</th><th>1-2.6 late</th><th>3-7.0 mid</th><th>3-7.0 late</th><th>5-8.5 mid</th><th>5-8.5 late</th><th>per model, ${wk==="hist"?"1981–2010":SCEN[S.scen]+" "+HOR[S.hor]}</th></tr>${table}</table></div></section>
  <section><div class="lab">In plain words</div><div>Today this cell spends about <b>${hm.toFixed(0)}</b> days a year inside a compound ${HZ[S.h].plain} event. ${wk==="hist"?"":`By ${HOR[S.hor]} under ${SCEN_PLAIN[S.scen]} (${SCEN[S.scen]}) that becomes about <b>${fm.toFixed(0)}</b> days${fm>=30?` (close to ${(fm/30.44).toFixed(1)} months)`:""}; ${agreeClause(inc>=3?inc:5-inc)} (${inc} of 5 increase; models range ${Math.min(...fd).toFixed(0)}–${Math.max(...fd).toFixed(0)}).`} Footprint days are not damage, exposure or people.</div></section>`}
 const thr=Object.keys(VARS).map(v=>{const t=sh.threshold[v][gi];const vd=VARS[v];const binds=vd.floorOn&&t!=null&&Math.abs(t-vd.floor)<1e-9*Math.max(1,Math.abs(vd.floor));return `<tr><td>${v}</td><td>${t==null?"–":vd.disp(t)}</td><td>${vd.floorOn?(binds?"floor binds":"local p"+Math.round(vd.pct*100)+" binds"):"local p"+Math.round(vd.pct*100)}</td><td>${sh.days[`${v}|hist`][gi]??"–"}</td><td>${sh.days[`${v}|${wkey()}`][gi]??"–"}</td></tr>`}).join("");
 html+=`<section><div class="lab">What counts as extreme here (exact per-cell, MPI-ESM1-2-HR in this mockup)</div><div class="tablewrap"><table class="data"><tr><th>variable</th><th>threshold</th><th>which bound</th><th>days/yr 1981–2010</th><th>days/yr ${wkey()==="hist"?"–":HOR[S.hor]+" "+SCEN[S.scen]}</th></tr>${thr}</table></div><div class="small">Each model has its own local thresholds; extreme-day counts are comparable across models, threshold values are not model warmth. The full build shows all five models.</div></section>
 <section><div class="lab">Down to the data</div>${li>=0?`<button class="btn" id="plEvents">Events touching this cell (${HZ[S.h].plain}) →</button> `:""}<button class="btn" id="plSingle">Single-hazard row for this cell →</button><div class="small" style="margin-top:4px">Full build adds: first year in record, 12-month risk ribbon per hazard, the five largest events covering this cell, pin up to four cells, copy as text, copy link.</div></section>`;
 dr.querySelector("#plBody").innerHTML=html;
 const pe=dr.querySelector("#plEvents");if(pe)pe.onclick=()=>{S.data.set="events";S.data.cell={lat,lon};S.data.q="";S.data.page=0;S.data.row=null;S.view=10;dr.classList.remove("open");render()};
 dr.querySelector("#plSingle").onclick=()=>{S.data.set="single";S.data.cell=null;S.data.q=`lat==${lat} & lon==${lon}`;S.data.page=0;S.data.row=null;S.view=10;dr.classList.remove("open");render()}}

/* ============ init ============ */
document.getElementById("modeBrief").onchange=e=>{S.brief=e.target.checked;render()};
document.getElementById("copyLink").onclick=async()=>{saveHash();try{await navigator.clipboard.writeText(location.href);setStatus("link copied ✓","ok")}catch(e){prompt("Copy this link:",location.href)}};
loadHash();document.getElementById("modeBrief").checked=S.brief;
render().catch(e=>{setStatus("error: "+e.message,"warn");console.error(e)});
</script>
